      <stop offset="0%" stop-color="#1a1b27"/>
      <stop offset="100%" stop-color="#70a5fd"/>
    </linearGradient>
    <style>
      .t { font: 700 52px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
